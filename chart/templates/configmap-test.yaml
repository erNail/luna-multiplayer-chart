---
suite: "configmap template"
templates:
  - "configmap.yaml"
tests:
  - it: "should render apiVersion with default value"
    set:
      configMap:
        enabled: true
    asserts:
      - equal:
          path: "apiVersion"
          value: "v1"

  - it: "should render apiVersion as set"
    set:
      configMap:
        enabled: true
      apiVersions:
        configMap: "v2"
    asserts:
      - equal:
          path: "apiVersion"
          value: "v2"

  - it: "should render annotations if set"
    set:
      configMap:
        enabled: true
        annotations:
          foo: "bar"
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar

  - it: "should render data with default values"
    set:
      configMap:
        enabled: true
    asserts:
      - isNotEmpty:
          path: "data"

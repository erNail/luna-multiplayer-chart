---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "luna-multiplayer"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/luna-multiplayer-chart"
      targetRevision: "feat/add-chart"
      path: "examples/argocd"
      ref: "values"
    - repoURL: "https://github.com/erNail/luna-multiplayer-chart"
      targetRevision: "feat/add-chart"
      path: "chart"
      helm:
        releaseName: "luna-multiplayer"
        valueFiles:
          - "$values/examples/argocd/values-luna-multiplayer.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "luna-multiplayer"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
...
